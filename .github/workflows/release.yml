name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Stripped by cargo rather than by `strip`, whose binutils on the runner only
  # understands the host architecture.
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  # One job builds both targets, because the completions and the man page are
  # generated by running bailey, and only the x86_64 build runs on the runner.
  # They are architecture independent, so they are made once and copied into
  # both archives.
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      # A tag that disagrees with the manifest produces a release nobody can
      # reproduce from the source it claims to be built from.
      - name: The tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "bailey") | .version')
          tag="${GITHUB_REF_NAME#v}"
          echo "manifest: $manifest, tag: $tag"
          test "$manifest" = "$tag" || {
            echo "::error::tag $GITHUB_REF_NAME does not match crate version $manifest"
            exit 1
          }

      # musl, statically linked: the binary then runs on any distribution
      # rather than on the ones whose glibc is new enough.
      - name: Build x86_64
        run: cargo build --release -p bailey --target x86_64-unknown-linux-musl

      # rust-lld rather than a cross gcc, so this needs nothing from apt.
      - name: Build aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo build --release -p bailey --target aarch64-unknown-linux-musl

      - name: Generate the completions and the man page
        run: |
          bailey=target/x86_64-unknown-linux-musl/release/bailey
          mkdir -p extras/completions
          for shell in bash fish zsh; do
            "$bailey" completions "$shell" > "extras/completions/bailey.$shell"
          done
          "$bailey" man > extras/bailey.1

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            stage="bailey-$version-$target"
            mkdir -p "$stage"
            cp "target/$target/release/bailey" "$stage/"
            cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
            cp -r extras/completions extras/bailey.1 "$stage/"
            tar -czf "dist/$stage.tar.gz" "$stage"
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: bailey-binaries
          path: dist/

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Statically linked, so the binary runs on any distribution. Each archive
          holds `bailey`, shell completions, the man page, and both licenses.

          The audit recorder is not in the archive. It needs `CAP_BPF` and
          `CAP_PERFMON` granted on your own machine, and a nightly toolchain with
          `bpf-linker` to build, so it is built from source:
          `cargo build --release -p bailey-bpf-helper`. Everything else, which is
          the whole sandbox, is in here and needs no privilege.

          Run `bailey doctor` first: it reports what your kernel can enforce and
          what each gap costs.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            dist/*
