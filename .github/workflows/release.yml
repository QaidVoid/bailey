name: release

# Attaches binaries to a release. release-plz creates the release itself, from
# the merge of its version-bump pull request, so this only ever adds assets to
# one that already exists.
#
# `workflow_dispatch` builds and uploads the archives as workflow artifacts
# without touching any release, which is how to check this without cutting one.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  # Stripped by cargo rather than by `strip`, whose binutils on the runner only
  # understands the host architecture.
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  # One job for both targets, because the completions and the man page are
  # generated by running bailey, and only the x86_64 build runs on the runner.
  # They are architecture independent, so they are made once and go in both
  # archives.
  binaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "bailey") | .version')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "building $version"

      # musl, statically linked: the binary then runs on any distribution rather
      # than on the ones whose glibc is new enough.
      - name: Build x86_64
        run: cargo build --release -p bailey --locked --target x86_64-unknown-linux-musl

      # rust-lld rather than a cross gcc or a container, so this needs nothing
      # installed to cross-compile.
      - name: Build aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo build --release -p bailey --locked --target aarch64-unknown-linux-musl

      - name: Generate the completions and the man page
        run: |
          bailey=target/x86_64-unknown-linux-musl/release/bailey
          mkdir -p extras/completions
          for shell in bash fish zsh; do
            "$bailey" completions "$shell" > "extras/completions/bailey.$shell"
          done
          "$bailey" man > extras/bailey.1

      - name: Package
        run: |
          mkdir -p dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            stage="bailey-$VERSION-$target"
            mkdir -p "$stage"
            cp "target/$target/release/bailey" "$stage/"
            cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
            cp -r extras/completions extras/bailey.1 "$stage/"
            tar -czf "dist/$stage.tar.gz" "$stage"
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # A sandbox is exactly the kind of binary someone should be able to check
      # came from this source and this workflow.
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: bailey-${{ env.VERSION }}
          path: dist/

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
