name: release

# Attaches binaries to a release. release-plz creates the release itself, from
# the merge of its version-bump pull request, so this only ever adds assets to
# one that already exists.
#
# `workflow_dispatch` builds and uploads the archives as workflow artifacts
# without touching any release, which is how to check this without cutting one.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  # Stripped by cargo rather than by `strip`, whose binutils only understands the
  # architecture it was built for.
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  # Each target builds on its own architecture, in parallel.
  #
  # The reason this is not one job cross-compiling both: the completions and the
  # man page are generated by running bailey, and an x86_64 runner cannot run an
  # aarch64 binary. Building natively means each job can run what it just built,
  # which also means the aarch64 binary is known to start before it ships, rather
  # than only to have linked.
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "bailey") | .version')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "building $version for ${{ matrix.target }}"

      # musl, statically linked: the binary then runs on any distribution rather
      # than on the ones whose glibc is new enough.
      - name: Build
        run: cargo build --release -p bailey --locked --target ${{ matrix.target }}

      - name: Generate the completions and the man page
        run: |
          bailey=target/${{ matrix.target }}/release/bailey
          "$bailey" --version
          mkdir -p extras/completions
          for shell in bash fish zsh; do
            "$bailey" completions "$shell" > "extras/completions/bailey.$shell"
          done
          "$bailey" man > extras/bailey.1

      - name: Package
        run: |
          stage="bailey-$VERSION-${{ matrix.target }}"
          mkdir -p "$stage" dist
          cp "target/${{ matrix.target }}/release/bailey" "$stage/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          cp -r extras/completions extras/bailey.1 "$stage/"
          tar -czf "dist/$stage.tar.gz" "$stage"

      # A sandbox is exactly the kind of binary someone should be able to check
      # came from this source and this workflow.
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: bailey-${{ env.VERSION }}-${{ matrix.target }}
          path: dist/

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # One SHA256SUMS covering both archives, rather than a checksum file each.
  # That is what v0.1.0 shipped, and a release layout that changes between
  # versions breaks whatever anyone wrote to consume the last one.
  checksums:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bailey-*
          merge-multiple: true
          path: dist

      - name: Combine
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS --clobber
