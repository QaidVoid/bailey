name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The sandbox itself: stable toolchain, no system dependencies, no privilege.
  #
  # Bare cargo commands act on default-members, which is the main tool and the
  # shared crate. The eBPF programs are a separate member whose only target is
  # behind a `bpf` feature nothing here enables, so they are not built by this
  # job; the audit-helper job below builds them for the BPF target.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets

      # What this runner can actually enforce, recorded before the tests run.
      # It says nothing about which tests skip: which tests run is asserted
      # exactly by the kernel matrix below, whose hosts are pinned. This job
      # runs on whatever kernel the runner image ships, so its skip set is
      # not stable enough to assert.
      - name: Host capabilities
        run: cargo run -p bailey --quiet -- doctor || true

      - name: Test
        run: cargo test

  # Delegation through the systemd user manager is tested only by
  # hand, because whether a runner has a user manager it may hand over a
  # delegated cgroup is an image property that can change under us, and a
  # red job for that would be noise rather than signal. To exercise it by
  # hand, on a host with systemd as init and a user that lingers:
  #
  #   sudo loginctl enable-linger "$USER"
  #   export XDG_RUNTIME_DIR=/run/user/$(id -u)
  #   cargo test -p bailey --test cgroup
  #
  # a_session_without_delegation_gets_a_user_scope must run rather than
  # skip, and `bailey doctor` must report `cgroup delegation: ... (systemd
  # user scope)`. The kernel matrix's guests boot without systemd, so the
  # new cgroup tests are expected to skip there, which ci/kernels/<id>.skips
  # records.

  # ci/kernels.json is also read by guest.sh inside each guest, and the
  # matrix cannot read files at parse time, so one tiny job hands it over.
  read-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: read
        run: echo "matrix=$(jq -c .kernel ci/kernels.json)" >> "$GITHUB_OUTPUT"

  # The sandbox on the kernels bailey supports, one pinned kernel per job.
  #
  # ci/kernels.json is the source of truth for the matrix, and ci/guest.sh is
  # the job's whole body: it boots nothing itself but prepares the guest,
  # drops to the checkout's uid, runs doctor and the suite, and holds the
  # results to ci/kernels/<id>.doctor and <id>.skips. A green job says both
  # what passed and exactly which tests skipped, per kernel.
  #
  # The kernel downloads land in the runner user's cache and are keyed by
  # version, so adding an entry only fetches the new kernel.
  kernels:
    needs: read-matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.read-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Standard runners ship /dev/kvm, but only root may open it until a
      # rule says otherwise. Without the device this job would fall back to
      # emulation and time out, so opening it is asserted before anything
      # downloads.
      - name: Allow the runner user to open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload
          sudo udevadm trigger /dev/kvm
          python3 -c "open('/dev/kvm', 'r+b')"

      - name: Install the guest toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 passt nftables
          python3 -m pip install --user --break-system-packages virtme-ng==1.42
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/virtme-ng
          key: virtme-ng-${{ runner.arch }}-${{ matrix.kernel.version }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: kernels

      # The guest runs the binaries this host built, and guest.sh drives both
      # the tool and the suite from target/debug.
      - name: Build
        run: |
          cargo test --no-run
          cargo build -p bailey

      # The sleep holds the job until the console is up: writes in the first
      # seconds of a boot never reach the host, and the job log is the only
      # channel the guest's results travel by. Four vcpus match the four
      # test threads guest.sh pins.
      # The matrix values travel by env, not by interpolation into the
      # script, so a kernels.json entry can only ever be data.
      - name: Boot ${{ matrix.kernel.version }} and run the suite
        env:
          KERNEL_VERSION: ${{ matrix.kernel.version }}
          KERNEL_APPEND: ${{ matrix.kernel.append }}
          KERNEL_ID: ${{ matrix.kernel.id }}
        run: >-
          vng --network user --cpus 4 -m 8192 -r "$KERNEL_VERSION"
          --append "$KERNEL_APPEND" --
          sh -c "sleep 3; ci/guest.sh $KERNEL_ID CARGO_HOME=$HOME/.cargo RUSTUP_HOME=$HOME/.rustup"

  # The other shipped architecture, natively: the suite runs on arm's own
  # kernel rather than in a VM, since arm runners do not expose KVM and
  # emulating the whole suite would be too slow for every push.
  #
  # No clippy here: it is architecture independent and the check job covers
  # it. Like the check job, doctor is informational only, on an unpinned
  # kernel.
  aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: aarch64

      - name: Build
        run: cargo build --all-targets

      - name: Host capabilities
        run: cargo run -p bailey --quiet -- doctor || true

      - name: Test
        run: cargo test

      - name: Check the musl release target
        run: cargo check --all-targets --target aarch64-unknown-linux-musl

  # The shipped binaries are musl, where the same source behaves differently:
  # std drops `O_PATH` from a custom open flag because musl's `O_ACCMODE`
  # contains its bit, which no glibc run can observe (issue #32). The
  # integration tests stay on the host job, since what they exercise is the
  # runner's sandbox rather than anything that varies by target.
  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: musl

      - name: Check everything compiles for the release target
        run: cargo check --all-targets --target x86_64-unknown-linux-musl

      - name: Unit tests on the release target
        run: cargo test --target x86_64-unknown-linux-musl --lib

  # The eBPF programs, checked for the BPF target.
  #
  # This compiles them but does not link them: linking needs bpf-linker, which
  # builds against whichever LLVM the current rustc nightly bundles, and there
  # is no apt package that tracks that. Chasing it would make this job fail for
  # reasons that have nothing to do with the code.
  #
  # So what is verified here is that the programs still compile for their target
  # and that the `bpf` feature gate still matches what the helper's build script
  # enables. Producing the object, and building the helper around it, needs
  # bpf-linker and happens on a developer's machine.
  ebpf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bpf

      - name: Check the programs compile for the BPF target
        run: |
          cargo check -p bailey-ebpf \
            --target bpfel-unknown-none \
            -Z build-std=core \
            --features bpf

  # The shipped dependencies, checked against the RustSec advisory database.
  # A sandbox that fetches and runs code is the kind of binary a known
  # vulnerability in a dependency should hold up, so this fails the push
  # rather than filing a report nobody reads. `rustsec/audit-check` reads the
  # workspace's Cargo.lock, which covers every member including the broker.
  audit:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # VitePress fails a build on a dead internal link, which is the failure worth
  # catching: these pages cross-reference heavily.
  docs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned: with `--frozen-lockfile` an unpinned bun turns its own upgrades
      # into a docs build failure. Bump this and the lockfile together.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
