[package]
name = "bailey-ebpf"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "eBPF observation programs for the bailey audit backend"

[dependencies]
aya-ebpf = "0.2.1"
bailey-common = { path = "../bailey-common" }

[[bin]]
name = "bailey-ebpf"
path = "src/main.rs"

# aya-build compiles this crate with --release; the workspace release profile
# (opt-level 3) is what the BPF verifier needs.
