[package]
name = "bailey"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Layered, deny-by-default sandbox for running untrusted programs on Linux"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = "1"
landlock = "0.4"
seccompiler = "0.4"
libc = "0.2"
enumflags2 = "0.7"
nix = { version = "0.29", features = ["sched", "mount", "fs"] }
# Used only to parse the fixed-size access records streamed by the privileged
# helper. No eBPF or aya dependency lives in the main tool.
bailey-common = { path = "../bailey-common" }
bytemuck = "1"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "bailey"
path = "src/main.rs"
