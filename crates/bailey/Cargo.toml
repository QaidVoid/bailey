[package]
name = "bailey"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Ergonomic layered sandbox for running untrusted games and binaries on Linux"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
landlock = "0.4"
seccompiler = "0.4"
libc = "0.2"
enumflags2 = "0.7"
bailey-common = { path = "../bailey-common", optional = true }
aya = { version = "0.14", optional = true }
bytemuck = { version = "1", optional = true }

[features]
# Compiles and embeds the eBPF audit backend. Requires a nightly toolchain and
# bpf-linker at build time, and CAP_BPF/CAP_PERFMON at run time.
ebpf = ["dep:bailey-common", "dep:aya", "dep:bytemuck"]

[build-dependencies]
aya-build = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "bailey"
path = "src/main.rs"
