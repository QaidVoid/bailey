# Additive profile for a coding agent: one project, and the API it talks to.
#
# An agent runs commands chosen at run time against code you care about, which
# is the case this tool exists for. It gets outbound HTTPS so it can reach its
# model, and the system paths the untrusted floor already grants. It does not
# get your home directory or any device.
#
# Grant the project in a `bailey.toml` next to it, since a profile cannot know
# where you are:
#
#     [filesystem]
#     read = ["."]
#     write = ["."]
#
# Isolation is on by default; keep it on, since it is what makes a `deny`
# inside the project enforceable and puts your other projects out of the
# agent's reach.
#
# What this egress rule enforces depends on the network mode. Automatic mode
# (the default) places an egress-allowing run in the private network namespace,
# which hides the host's address and the host's loopback services. With a
# destination rule in place the built-in egress broker serves the run: the
# broker admits only the destinations the policy allows, and an `[http]`
# section can intercept hosts and attach credentials from your environment,
# so the agent's key stays out of its reach. `broker = "ADDR:PORT"` or
# `--egress-proxy ADDR:PORT` names an external broker instead. The modes and
# their reasons are in the network guide, docs/guide/network.md.
#
# The rule stays `*` because a profile cannot know which API you use. To pin
# the agent to its model's endpoint and keep its key out of the sandbox,
# replace the rule with the host you use and bind the key to it, and bailey
# resolves the host once and admits only the addresses it returned:
#
#     [network]
#     egress_allow = [{ host = "api.anthropic.com", port = 443 }]
#
#     [http]
#     intercept = ["api.anthropic.com"]
#
#     [[http.credential]]
#     host = "api.anthropic.com"
#     auth = "header:x-api-key"
#     source = "env:ANTHROPIC_API_KEY"
#
# A credential binding is accepted from a caller's own layer (a profile, the
# global config or `--config`), not from a project's discovered bailey.toml,
# and the variable it names is denied to the agent's environment whatever a
# `pass` says.
#
# For an agent that must not reach the network, use the `untrusted` floor,
# which denies it outright.
#
# Certificates come from the floor's read access to /usr and /etc.

[network]
egress_allow = [{ host = "*", port = 443 }]
