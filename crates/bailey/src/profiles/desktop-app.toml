# Additive profile for a desktop application.
#
# Display, audio, fonts, and icons, with no device access beyond what the
# compositor needs. Narrower than the game profile: no controllers, no direct
# GPU nodes beyond rendering.

[filesystem]
write = ["${XDG_RUNTIME_DIR}"]
read = [
    # Read as well as write: programs that keep state here, dconf among them,
    # read it back before writing it, and a write-only grant leaves them
    # failing with a permission error rather than doing without.
    "${XDG_RUNTIME_DIR}",
    "/usr/share/fonts",
    "~/.fonts",
    "~/.local/share/fonts",
    "~/.config/fontconfig",
    "~/.icons",
    "/usr/share/icons",
    "/usr/share/mime",
    "/usr/share/applications",
]
connect = [
    # Display and audio. On a kernel with Landlock ABI 9 a directory grant
    # alone no longer connects, so the sockets a desktop program talks to are
    # listed here, one by one.
    "${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}",
    "${XDG_RUNTIME_DIR}/pulse/native",
    "${XDG_RUNTIME_DIR}/pipewire-0",
    # The session bus is deliberately absent: through it a target can ask
    # systemd --user to start a process outside any sandbox. A program that
    # needs the bus gets exactly that back by adding one line, and accepts
    # what it costs:
    # "${XDG_RUNTIME_DIR}/bus",
]

[[device]]
path = "/dev/dri"
access = "rw"

[[device]]
path = "/dev/snd"
access = "rw"
