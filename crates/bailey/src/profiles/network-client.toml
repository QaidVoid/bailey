# Additive profile for a tool that fetches over the network and nothing more.
#
# Outbound HTTPS and the files needed to verify it. This egress rule enforces
# TCP to port 443, and only in the host's network namespace, which is the
# default when a policy allows egress: there the agent reaches any host on
# 443, and UDP is unrestricted. `--proxy-net` moves the run into a private
# namespace that hides the host's address and loopback, and
# `--egress-proxy ADDR:PORT` confines egress to a broker instead. The modes
# are in the network guide, docs/guide/network.md.

[filesystem]
read = ["/etc/ssl", "/usr/share/ca-certificates", "/etc/resolv.conf", "/etc/hosts"]

[network]
egress_allow = [{ host = "*", port = 443 }]
