# Additive profile for a tool that fetches over the network and nothing more.
#
# Outbound HTTPS and the files needed to verify it. This egress rule enforces
# TCP to port 443. Automatic mode (the default) places an egress-allowing run
# in the private network namespace, which hides the host's address and
# loopback and needs pasta and user namespaces. `mode = "host"` in a config
# shares the host's namespace instead, where UDP is unrestricted, and
# `broker = "ADDR:PORT"` or `--egress-proxy ADDR:PORT` confines egress to a
# broker instead. The modes are in the network guide, docs/guide/network.md.

[filesystem]
read = ["/etc/ssl", "/usr/share/ca-certificates", "/etc/resolv.conf", "/etc/hosts"]

[network]
egress_allow = [{ host = "*", port = 443 }]
