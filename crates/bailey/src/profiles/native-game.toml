# Additive profile for native Linux games.
#
# Layers GPU, audio, display, controller, and font access on top of the
# untrusted base. It does not grant the game's own directory or save location:
# add those in per-game config, and tighten the rest with an audit run.

[filesystem]
read = [
    "/usr/share/fonts",
    "~/.fonts",
    "~/.local/share/fonts",
    "~/.config/fontconfig",
    "~/.icons",
    "/usr/share/icons",
    # Read as well as write, below: programs that keep state in the runtime
    # directory read it back, and a shader cache exists to be read from.
    "${XDG_RUNTIME_DIR}",
    "~/.cache/mesa_shader_cache",
    "/usr/share/vulkan",
    "/usr/share/glvnd",
    "/sys/dev/char",
    "/sys/devices",
]
write = [
    # The session runtime directory holds the compositor and audio sockets.
    # Scoped to this user: /run/user itself would cover every logged-in account.
    "${XDG_RUNTIME_DIR}",
    "~/.cache/mesa_shader_cache",
]
connect = [
    # Display and audio. On a kernel with Landlock ABI 9 a directory grant
    # alone no longer connects, so the sockets a game talks to are listed
    # here, one by one.
    "${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}",
    "${XDG_RUNTIME_DIR}/pulse/native",
    "${XDG_RUNTIME_DIR}/pipewire-0",
    # The session bus is deliberately absent: through it a target can ask
    # systemd --user to start a process outside any sandbox. A game that
    # needs the bus gets exactly that back by adding one line, and accepts
    # what it costs:
    # "${XDG_RUNTIME_DIR}/bus",
]

[[device]]
path = "/dev/dri"
access = "rw"

[[device]]
path = "/dev/snd"
access = "rw"

# The proprietary NVIDIA driver does not use /dev/dri alone. A path that does
# not exist is skipped, so these are harmless on other drivers.
[[device]]
path = "/dev/nvidiactl"
access = "rw"

[[device]]
path = "/dev/nvidia0"
access = "rw"

[[device]]
path = "/dev/nvidia-uvm"
access = "rw"

[[device]]
path = "/dev/nvidia-uvm-tools"
access = "rw"

# Controllers. This covers every input device, including the keyboard, which is
# a keylogging surface: grant the specific event node instead where you can.
[[device]]
path = "/dev/input"
access = "r"
