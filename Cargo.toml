[workspace]
resolver = "2"
members = [
    "crates/bailey",
    "crates/bailey-common",
    "crates/bailey-ebpf",
    "crates/bailey-bpf-helper",
]
# Only the unprivileged main tool and the shared crate build by default. The BPF
# program crate and the privileged helper need a nightly toolchain and
# bpf-linker, so bare host builds and tests skip them; build the helper with
# `cargo build -p bailey-bpf-helper`.
default-members = ["crates/bailey", "crates/bailey-common"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
