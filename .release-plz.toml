[workspace]
changelog_update = true
dependencies_update = false
# The release itself is enabled for `bailey` alone, below. Nothing else in the
# workspace is something anyone installs.
git_release_enable = false
# Nothing here goes to crates.io: `bailey-ebpf` only builds for the BPF target,
# the helper is useless without capabilities granted locally, and `bailey-common`
# is a private wire format between the two. Set this true per package if that
# ever changes.
publish = false
release_always = false
# Only meaningful for a published library API, and nothing here is one.
semver_check = false
pr_labels = ["release"]
git_release_body = """
{{ changelog }}
{% if remote.contributors %}
### Contributors
{% for contributor in remote.contributors %}
* @{{ contributor.username }}
{% endfor %}
{% endif %}
"""

[[package]]
name = "bailey"
git_tag_name = "v{{ version }}"
git_release_enable = true
changelog_path = "./CHANGELOG.md"
# The other crates have no release of their own, so their commits belong in this
# changelog rather than nowhere.
changelog_include = ["bailey-common", "bailey-bpf-helper", "bailey-ebpf"]

[[package]]
name = "bailey-common"
release = false

[[package]]
name = "bailey-bpf-helper"
release = false

[[package]]
name = "bailey-ebpf"
release = false

[changelog]
header = """
# Changelog

"""
body = """
{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}]({{ remote.link }}/commit/{{ commit.id }}))\
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]\
          ({{ release_link }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
"""
trim = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->⛰️  Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^refactor\\(clippy\\)", skip = true },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore|^ci|^build", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
]
