[workspace]
changelog_update = true
dependencies_update = false
# The release itself is enabled for `bailey` alone, below. Nothing else in the
# workspace is something anyone installs.
git_release_enable = false
# Off by default, on for the two crates below. `bailey-ebpf` only builds for the
# BPF target and the helper is inert without capabilities granted locally, so
# neither is something anyone would install from crates.io.
publish = false
release_always = false
# `bailey-common` is a published library, but it is the wire format between the
# sandbox and its helper rather than an API anyone builds against: the two are
# released together and a version byte in the protocol is what guards
# compatibility. Forcing major bumps on it would be noise.
semver_check = false
pr_labels = ["release"]
git_release_body = """
{{ changelog }}
{% if remote.contributors %}
### Contributors
{% for contributor in remote.contributors %}
* @{{ contributor.username }}
{% endfor %}
{% endif %}
"""

[[package]]
name = "bailey"
publish = true
git_tag_name = "v{{ version }}"
git_release_enable = true
changelog_path = "./CHANGELOG.md"
# The other crates have no release of their own, so their commits belong in this
# changelog rather than nowhere.
changelog_include = ["bailey-common", "bailey-bpf-helper", "bailey-ebpf"]

# Published because `bailey` depends on it, and cargo refuses to publish a crate
# whose dependency is not on the registry. It gets no tag and no GitHub release
# of its own: there is one thing to download here, and this is not it.
[[package]]
name = "bailey-common"
publish = true
git_tag_enable = false
git_release_enable = false
# Its commits reach the root changelog through `changelog_include` above, so a
# second changelog beside it would just be the same entries in a worse place.
changelog_update = false

[[package]]
name = "bailey-bpf-helper"
release = false

[[package]]
name = "bailey-ebpf"
release = false

[changelog]
header = """
# Changelog

"""
body = """
{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}]({{ remote.link }}/commit/{{ commit.id }}))\
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]\
          ({{ release_link }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
"""
trim = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->⛰️  Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^refactor\\(clippy\\)", skip = true },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore|^ci|^build", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
]
